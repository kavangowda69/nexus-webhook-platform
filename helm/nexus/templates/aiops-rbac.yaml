apiVersion: v1
kind: ServiceAccount
metadata:
  name: aiops-service-account
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aiops-role
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aiops-role-binding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: aiops-service-account
    namespace: default
roleRef:
  kind: Role
  name: aiops-role
  apiGroup: rbac.authorization.k8s.io