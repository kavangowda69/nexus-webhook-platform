apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: webhook-api
  template:
    metadata:
      labels:
        app: webhook-api
    spec:
      containers:
        - name: webhook-api
          image: {{ .Values.api.image }}:{{ .Values.api.tag }}
          imagePullPolicy: Never
          ports:
            - containerPort: {{ .Values.api.port }}
          command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
          envFrom:
            - configMapRef:
                name: nexus-config
            - secretRef:
                name: nexus-secret
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.api.port }}
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.api.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
spec:
  selector:
    app: webhook-api
  type: NodePort
  ports:
    - port: {{ .Values.api.port }}
      targetPort: {{ .Values.api.port }}
      nodePort: 30080