apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-receiver
spec:
  replicas: {{ .Values.receiver.replicas }}
  selector:
    matchLabels:
      app: webhook-receiver
  template:
    metadata:
      labels:
        app: webhook-receiver
    spec:
      containers:
        - name: webhook-receiver
          image: {{ .Values.receiver.image }}:{{ .Values.receiver.tag }}
          imagePullPolicy: Never
          ports:
            - containerPort: {{ .Values.receiver.port }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.receiver.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: receiver-service
spec:
  selector:
    app: webhook-receiver
  ports:
    - port: {{ .Values.receiver.port }}
      targetPort: {{ .Values.receiver.port }}