apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-worker
spec:
  {{- if not (default false .Values.worker.autoscaling.enabled) }}
  replicas: {{ .Values.worker.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app: webhook-worker
  template:
    metadata:
      labels:
        app: webhook-worker
    spec:
      containers:
        - name: webhook-worker
          image: {{ .Values.worker.image }}:{{ .Values.worker.tag }}
          imagePullPolicy: Never
          command: ["python", "-m", "api.worker.worker"]
          envFrom:
            - configMapRef:
                name: nexus-config
            - secretRef:
                name: nexus-secret
          ports:
            - containerPort: {{ .Values.worker.port }}
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: worker-metrics-service
spec:
  selector:
    app: webhook-worker
  ports:
    - port: 9090
      targetPort: 9090