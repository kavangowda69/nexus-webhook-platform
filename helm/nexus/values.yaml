api:
  image: nexus-webhook-api
  tag: latest
  replicas: 1
  port: 8000

worker:
  image: nexus-webhook-worker
  tag: latest
  replicas: 2   
  port: 9090

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    cpuUtilization: 50

receiver:
  image: nexus-webhook-receiver
  tag: latest
  replicas: 1
  port: 8001

postgres:
  image: postgres
  tag: "15"
  user: webhook_user
  password: webhook_pass
  db: webhook_db

redis:
  image: redis
  tag: "7"

config:
  logLevel: INFO
  rateLimit: "10"
  redisHost: redis-service
  redisPort: "6379"



aiops:
  image: nexus-aiops
  tag: latest
  enabled: true
  interval: 30
  prometheusUrl: "http://prometheus:9091"
  elasticsearchUrl: "http://elasticsearch:9200"
  ollamaUrl: "http://host.minikube.internal:11434/api/generate"