global:
  scrape_interval: 5s

rule_files:
  - /etc/prometheus/prometheus_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: webhook_api
    static_configs:
      - targets: ["webhook_api:8000"]

  - job_name: webhook_worker
    static_configs:
      - targets: ["webhook_worker:9090"]